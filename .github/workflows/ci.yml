name: requirements

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:lab-network
      - uses: actions/upload-artifact@v4
        with:
          name: outcomes-unit
          path: test-results/outcomes-unit.jsonl

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: OLFX_OUTCOMES=test-results/outcomes-browser.jsonl npx playwright test --project=chromium --project=firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outcomes-browser
          path: test-results/outcomes-browser.jsonl

  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate synthetic clips and ffprobe them
        run: bash scripts/media/generate-clips.sh

  fullstack:
    runs-on: ubuntu-latest
    env:
      SIMULATOR_TOKEN: ${{ secrets.SIMULATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose -f docker-compose.fullstack.yml config
      - name: Explain unavailable private simulator coverage
        if: env.SIMULATOR_TOKEN == ''
        run: echo 'Live lab coverage is unavailable without SIMULATOR_TOKEN; compose validation is not an integration test.'
      - uses: actions/setup-node@v4
        if: env.SIMULATOR_TOKEN != ''
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        if: env.SIMULATOR_TOKEN != ''
        with:
          dotnet-version: '8.0.x'
      - name: Provision live lab prerequisites
        if: env.SIMULATOR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SIMULATOR_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          npm ci
          npx playwright install --with-deps chromium
          gh repo clone openlightfx/openlightfx-simulator docker/simulator-src
          git clone https://github.com/openlightfx/openlightfx-emby.git ../openlightfx-emby
          python3 -m venv /tmp/olfx-simulator-tests
          /tmp/olfx-simulator-tests/bin/pip install aiohttp
          PYTHONPATH=docker/simulator-src/src /tmp/olfx-simulator-tests/bin/python -m unittest discover -s docker/simulator-src/tests
      - name: Build and test isolated Emby lab
        if: env.SIMULATOR_TOKEN != ''
        run: |
          node scripts/fullstack/lab.mjs start
          node scripts/fullstack/lab.mjs run
          OLFX_LAB_PLAYBACK=web node scripts/fullstack/lab.mjs run
      - name: Stop isolated lab
        if: always() && env.SIMULATOR_TOKEN != ''
        run: node scripts/fullstack/lab.mjs stop

  report:
    needs: [check, prettier, unit, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: outcomes-unit
          path: test-results
      - uses: actions/download-artifact@v4
        with:
          name: outcomes-browser
          path: test-results
      - name: Requirement report
        run: node scripts/report/requirements-report.mjs
